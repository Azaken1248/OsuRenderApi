services:
  postgres:
    image: postgres:16-alpine
    container_name: osurender-postgres
    command: -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osurender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osurender}
      POSTGRES_DB: ${POSTGRES_DB:-osurender}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: osurender-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: osurender-api
    ports:
      - "8727:8727"
    mem_limit: 1g
    cpus: 1
    env_file: .env
    environment:
      - WORKER_TYPE=api
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    build: .
    container_name: osurender-dispatcher
    mem_limit: 512m
    cpus: 0.5
    env_file: .env
    environment:
      - WORKER_TYPE=dispatcher
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: osurender-worker
    mem_limit: 512m
    cpus: 0.5
    env_file: .env
    environment:
      - WORKER_TYPE=celery
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-beat:
    build: .
    container_name: osurender-worker-beat
    mem_limit: 256m
    cpus: 0.25
    env_file: .env
    environment:
      - WORKER_TYPE=beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: osurender-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: osurender-grafana
    ports:
      - "3727:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
