# Alembic Configuration
# ======================
# This file is used by Alembic to manage database migrations.

[alembic]
# Path to migration versions
script_location = alembic

# Template for migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Truncate long revision IDs for readability
truncate_slug_length = 40

# Use 'true' to run the environment setup even for `--hierarchical` commands
prepend_sys_path = .

# Timezone used for migration file timestamps (UTC for consistency)
timezone = UTC

# The database URL is injected programmatically from src/core/config.py
# via alembic/env.py. Do NOT hardcode it here.
sqlalchemy.url = 


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
